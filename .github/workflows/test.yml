name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # jt.py needs 3.9+ (Path.is_relative_to)
      - run: python3 bin/test_jt.py
      - run: python3 bin/jt.py demo
